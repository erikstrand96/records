openapi: "3.1.0"
info:
  title: Records API
  description: >
    API for managing a collection of vinyl records.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /records:
    get:
      summary: List all records
      description: Returns a list of all vinyl records in the collection.
      responses:
        "200":
          description: A JSON array of records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "500":
          description: Internal server error when querying records fails.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    Record:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the record.
        title:
          type: string
          description: Title of the record.
        artist:
          type: string
          description: Artist of the record.
        year:
          type: integer
          description: Release year of the record.
          nullable: true
        genre:
          type: string
          description: Genre of the record.
          nullable: true
        notes:
          type: string
          description: Additional notes about the record.
          nullable: true
      required:
        - id
        - title
        - artist
    ProblemDetails:
      type: object
      description: >
        RFC 9457 Problem Details object for standardized error responses.
        See https://www.rfc-editor.org/rfc/rfc9457.html
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type. Defaults to "about:blank".
          example: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: "Internal Server Error"
        status:
          type: integer
          description: HTTP status code generated by the origin server.
          example: 500
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
          example: "Failed to query records from database"
        instance:
          type: string
          description: URI reference that identifies the specific occurrence of the problem.
          example: "/records"
