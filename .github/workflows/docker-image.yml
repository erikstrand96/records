name: Docker Image CI

on:
  push:
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4
    
    - uses: 'google-github-actions/auth@v3'
      name: Authenticate Google Cloud
      with:
        project_id: 'records'
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }} # "projects/123456789/locations/global/workloadIdentityPools/github/providers/my-repo"
    
    - name: Build the Docker image
      run: docker build --file Dockerfile --tag europe-north2-docker.pkg.dev/${{ secrets.GCLOUD_PROJECT_ID }}/erst/records:${{ github.sha }} .

    - name: Push Docker image
      run: docker push europe-north2-docker.pkg.dev/${{ secrets.GCLOUD_PROJECT_ID }}/erst/records:${{ github.sha }}
